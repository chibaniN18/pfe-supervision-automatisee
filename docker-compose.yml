version: "3.9"
services:
  api:
    build: .
    container_name: fastapi-api
    ports:
      - "8001:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    container_name: postgres-db
    environment:
      POSTGRES_USER: pfe
      POSTGRES_PASSWORD: pfe123
      POSTGRES_DB: pfe_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pfe -d pfe_db"]
      interval: 5s
      timeout: 5s
      retries: 5

